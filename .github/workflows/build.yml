name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows portable exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portable exe
        run: npx electron-builder --win portable --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlassConvert-portable
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
